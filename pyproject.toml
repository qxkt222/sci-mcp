[project]
name = "sci-mcp"
version = "0.1.0"
description = "Local scientific computing MCP server: symbolic math, physics units, numerical simulation, PDE, statistics, signal processing, optimization and plotting"
readme = "README.md"
authors = [
    { name = "qxkt222" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mcp[cli]>=2.3.0",
    "numpy>=2.5.4",
    "pint>=0.26.1",
    "pywavelets>=1.10.0",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "sympy>=1.14.0",
]

[project.scripts]
sci-mcp = "sci_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
